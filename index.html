
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>棒人間格闘 | bounin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ゲーム全体の枠 */
    #unity-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      flex: none;
    }

    /* Unityのキャンバス */
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* ローディング表示 */
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(80%, 300px);
      display: none;
    }

    #unity-logo {
      width: 100%;
      height: 30px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 10px;
      background: #444;
      margin-top: 10px;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #fff;
    }

    /* Unityの警告表示 */
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 5;
      width: 90%;
      color: #000;
    }

    /* 下部のタイトルと全画面ボタン */
    #unity-footer {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 4;
    }

    #unity-fullscreen-button {
      width: 24px;
      height: 24px;
      cursor: pointer;
      background: #333;
      border: 1px solid #fff;
    }

    #unity-build-title {
      font-size: 12px;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-fullscreen-button" title="全画面表示"></div>
      <div id="unity-build-title">bounin</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const container = document.querySelector("#unity-container");

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      const div = document.createElement("div");

      div.textContent = msg;
      div.style.padding = "10px";

      if (type === "error") {
        div.style.background = "red";
        div.style.color = "white";
      } else {
        div.style.background = "yellow";
        div.style.color = "black";
      }

      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    /* 今回のUnityビルド名：bouninunity3 */
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/bouninunity3.loader.js";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/bouninunity3.data",
      frameworkUrl: buildUrl + "/bouninunity3.framework.js",
      codeUrl: buildUrl + "/bouninunity3.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "bounin",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    /*
      960×600（8:5）の比率を維持しながら、
      ブラウザの幅・高さの両方に収める。
    */
    function resizeGame() {
      const gameRatio = 960 / 600;

      const availableWidth = window.innerWidth;
      const availableHeight = window.innerHeight;

      const width = Math.min(
        availableWidth,
        availableHeight * gameRatio
      );

      const height = width / gameRatio;

      container.style.width = width + "px";
      container.style.height = height + "px";
    }

    window.addEventListener("resize", resizeGame);
    resizeGame();

    /* Unityの読み込み */
    document.querySelector("#unity-loading-bar").style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full")
          .style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };

    script.onerror = () => {
      alert(
        "ゲームの読み込みに失敗しました。\n" +
        "Buildフォルダ内のbouninunity3ファイルを確認してください。"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
